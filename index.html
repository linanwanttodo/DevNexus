<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>DevNexus</title>
    <script>
      // Prevent theme flash: apply Arco theme before Vue mounts
      (function () {
        var theme = localStorage.getItem("devnexus-theme") || "dark";
        var resolved =
          theme === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;
        document.body.setAttribute("arco-theme", resolved);
        document.documentElement.setAttribute("data-theme", resolved);
      })();
    </script>
    <style>
      /* Critical base styles to prevent white flash */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #161616;
        color: rgba(235, 235, 235, 0.87);
        overflow: hidden;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
      }
      [data-theme="light"] body,
      [data-theme="light"] {
        background-color: #f8f8f8;
      }
      /* Hide app content until Vue mounts (prevents raw key flash) */
      #app {
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      #app.ready {
        opacity: 1;
      }
      /* Loading skeleton shown until Vue mounts */
      #app:empty {
        display: flex;
        height: 100vh;
        opacity: 1;
      }
      #app:empty::after {
        content: "";
        width: 240px;
        flex-shrink: 0;
        border-right: 1px solid rgba(255, 255, 255, 0.10);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

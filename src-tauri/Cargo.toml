[package]
name = "devnexus"
version = "1.3.16"
description = "One-stop developer toolstack manager"
authors = ["DevNexus"]
edition = "2021"

[lib]
name = "devnexus_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "custom-protocol"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38.4"
which = "8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "net", "sync", "fs"] }
async-stream = "0.3"
bytes = "1"
russh = "0.62"
russh-sftp = "2.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }

# Cryptography libraries (used for password management and API key encryption)
aes-gcm = "0.10"  # AES-256-GCM authenticated encryption
cbc = "0.1"      # CBC mode for legacy cookie decryption
aes = "0.8"      # AES block cipher
sha2 = "0.10"    # SHA-256 hashing
sha1 = "0.10"    # SHA-1 for compatibility (legacy systems)
pbkdf2 = { version = "0.12", features = ["simple"] }  # Key derivation
base64 = "0.21"  # Base64 encoding
rand = "0.8"     # Random number generation

zip = "0.6"
csv = "1.3"
rusqlite = { version = "0.31", features = ["bundled"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
walkdir = "2"
semver = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
wait-timeout = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Security_Cryptography",
  "Win32_Foundation",
  "Win32_System_Memory",
] }
winreg = "0.52"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 无额外依赖
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
keyring = { version = "3", features = ["sync-secret-service"] }
# 灵动岛跨工作区可见：tao 的 set_visible_on_all_workspaces 走 GTK stick()，
# 在 XWayland/GNOME 下偶发不生效，这里直接用 X11 协议设置 _NET_WM_STATE_STICKY。
x11-dl = "2"
gtk = "0.18"
gdkx11 = "0.18"

[dev-dependencies]
# Testing utilities
tokio-test = "0.4"

# Security audit tooling (run with: cargo install cargo-audit && cargo audit)
# cargo-audit checks for known vulnerabilities in dependencies
# cargo-deny provides more comprehensive dependency analysis

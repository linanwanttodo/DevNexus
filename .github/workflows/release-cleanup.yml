name: Release Cleanup

on:
  release:
    types: [published]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 守卫 1：仅允许在上游主仓库执行清理，防止 fork / 误配置仓库被误删 release
      - name: Validate repository before cleanup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXPECTED_REPO="linanwanttodo/DevNexus"
          ACTUAL_REPO="${{ github.repository }}"
          if [ "$ACTUAL_REPO" != "$EXPECTED_REPO" ]; then
            echo "::error::Repository guard failed: '$ACTUAL_REPO' != '$EXPECTED_REPO'. Cleanup aborted."
            exit 1
          fi
          echo "Repository verified: $ACTUAL_REPO"

      - name: Delete old releases (keep latest 3 as rollback targets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=3
          REPO="${{ github.repository }}"
          EXPECTED_REPO="linanwanttodo/DevNexus"

          # 守卫 2（删除前二次断言仓库）：循环内逐条删除前再次确认仓库归属
          if [ "$REPO" != "$EXPECTED_REPO" ]; then
            echo "::error::Repository guard failed: '$REPO' != '$EXPECTED_REPO'. Cleanup aborted."
            exit 1
          fi

          # 按发布时间降序，跳过最新 $KEEP 个，删除其余（保留回滚窗口）
          gh release list --limit 100 --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .['"$KEEP"':] | .[].tagName' \
            | while read tag; do
              # 守卫 3（删除前二次断言前缀）：仅清理版本格式（v* 或数字开头）的 release/tag
              case "$tag" in
                v*|[0-9]*)
                  echo "Deleting old release: $tag (version-format verified)"
                  gh release delete "$tag" --yes --cleanup-tag || echo "::warning::Failed to delete release $tag"
                  ;;
                *)
                  echo "::warning::Skipping '$tag' — tag does not match version format (v* / numeric); NOT deleting."
                  ;;
              esac
            done
